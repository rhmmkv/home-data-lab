name: home-data-lab-bi

services:
  metabase:
    image: metabase/metabase:v0.65.3.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: database
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase_app
      MB_DB_USER: metabase_app
      MB_DB_PASS: "${MB_DB_PASS:?Set MB_DB_PASS in .env}"
    networks:
      - lab
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

networks:
  lab:
    external: true
    name: home-data-lab_default
